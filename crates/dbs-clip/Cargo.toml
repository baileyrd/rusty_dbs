[package]
name = "dbs-clip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure clip core for the knowledge pipeline: HTML in, Obsidian-style markdown with frontmatter out. A Rust port of url2obs's extractor (baileyrd/url2obs@9d47b33)."

# Every dependency below is already in Cargo.lock (scraper and its
# ego-tree via dbs-connector-support, url via reqwest, chrono and sha2
# via dbs-core): no new third-party code enters the build.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ego-tree = "0.11"
scraper = "0.27.0"
sha2 = "0.10"
url = "2"
